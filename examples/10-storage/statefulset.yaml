# A StatefulSet: Pods with stable names (redis-0, redis-1) and their OWN disk each.
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  clusterIP: None # "headless": gives each Pod its own DNS name, e.g. redis-0.redis
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          args: ["--appendonly", "yes"] # save data to disk
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates: # one PersistentVolumeClaim per Pod: data-redis-0, data-redis-1
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
