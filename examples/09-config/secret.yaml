# Secret values. "stringData" lets you write plain text; Kubernetes stores it base64-encoded.
# base64 is NOT encryption — anyone who can read Secrets can read this.
# Never commit real secrets to git; this is a learning example.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  DB_PASSWORD: "not-a-real-password"
