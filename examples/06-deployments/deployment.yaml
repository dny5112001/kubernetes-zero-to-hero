# A Deployment keeps N copies (replicas) of a Pod running, and handles updates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  labels:
    app: whoami
spec:
  replicas: 3
  selector:
    matchLabels:
      app: whoami # "the Pods I own are the ones with this label"
  template: # the Pod "cookie cutter"
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          ports:
            - containerPort: 80
