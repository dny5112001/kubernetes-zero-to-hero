# Two small apps ("blue" and "green"), each with a Deployment and a Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue
spec:
  replicas: 1
  selector:
    matchLabels: { app: blue }
  template:
    metadata:
      labels: { app: blue }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          args: ["--name=blue"]
---
apiVersion: v1
kind: Service
metadata:
  name: blue
spec:
  selector: { app: blue }
  ports: [{ port: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: green
spec:
  replicas: 1
  selector:
    matchLabels: { app: green }
  template:
    metadata:
      labels: { app: green }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          args: ["--name=green"]
---
apiVersion: v1
kind: Service
metadata:
  name: green
spec:
  selector: { app: green }
  ports: [{ port: 80 }]
