# One front door, routing by web address:
#   http://blue.localhost:8090   -> blue Service
#   http://localhost:8090/green  -> green Service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: colours
spec:
  ingressClassName: traefik
  rules:
    - host: blue.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blue
                port: { number: 80 }
    - http:
        paths:
          - path: /green
            pathType: Prefix
            backend:
              service:
                name: green
                port: { number: 80 }
