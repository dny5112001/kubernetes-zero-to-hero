# Health checks (probes) and resource requests/limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthy
  template:
    metadata:
      labels:
        app: healthy
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11
          ports:
            - containerPort: 80
          resources:
            requests: # what the Pod is guaranteed; used to pick a node
              cpu: 50m # 50 "millicores" = 5% of one CPU core
              memory: 32Mi
            limits:
              memory: 64Mi # use more than this and the container is killed (OOMKilled)
          startupProbe: # "has it finished starting?" — other probes wait for this
            httpGet: { path: /health, port: 80 }
            failureThreshold: 10
            periodSeconds: 2
          readinessProbe: # "can it take traffic right now?" — failing = removed from the Service
            httpGet: { path: /health, port: 80 }
            periodSeconds: 5
          livenessProbe: # "is it stuck?" — failing = container restarted
            httpGet: { path: /health, port: 80 }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: healthy
spec:
  selector:
    app: healthy
  ports:
    - port: 80
