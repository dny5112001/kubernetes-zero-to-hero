# A Pod locked down the way production Pods should be.
apiVersion: v1
kind: Pod
metadata:
  name: locked-down
spec:
  automountServiceAccountToken: false # this app doesn't talk to the Kubernetes API
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "id; touch /tmp/ok && echo can write /tmp; touch /oops || echo cannot write /; sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
