# Who can do what. A ServiceAccount (an identity for apps) that may only READ Pods
# in the "default" namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role # a list of allowed actions, inside one namespace
metadata:
  name: read-pods
rules:
  - apiGroups: [""] # "" = the core group (Pods, Services, ConfigMaps...)
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding # gives the Role to someone
metadata:
  name: pod-reader-can-read-pods
subjects:
  - kind: ServiceAccount
    name: pod-reader
    namespace: default
roleRef:
  kind: Role
  name: read-pods
  apiGroup: rbac.authorization.k8s.io
